<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat commands · UpATree</title>
    <meta name="description" content="Every chat command the UpATree bot answers, searchable.">
    <meta property="og:title" content="Chat commands · UpATree">
    <meta property="og:description" content="Every chat command the UpATree bot answers, searchable.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="upatree.ca">
    <meta property="og:url" content="https://upatree.ca/commands/">
    <meta property="og:image" content="https://upatree.ca/og/mark.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="UpATree">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#ce7aff">
    <link rel="canonical" href="https://upatree.ca/commands/">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500;700&display=swap">

    <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="commands">
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar" id="topbar"></header>

    <main>
        <section id="commands" class="section section--page section--commands">
            <header class="section-head">
                <h1 class="section-title">Chat Commands</h1>
                <p class="section-lede">
                    Anything chat-typeable that the bot responds to. Type the trigger in chat
                    and the bot answers in kind. Search to narrow the list.
                </p>
            </header>

            <div class="filter-bar">
                <label class="filter-label" for="filter-input">
                    <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
                        <circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="13.5" y1="13.5" x2="17.5" y2="17.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    Filter
                </label>
                <input
                    id="filter-input"
                    type="search"
                    autocomplete="off"
                    placeholder="!bttv, money, code..."
                    spellcheck="false">
                <output class="filter-count" id="filter-count" for="filter-input">—</output>
            </div>

            <div class="commands-status" id="commands-status" role="status" aria-live="polite">
                Loading commands…
            </div>

            <div class="commands-scroll" id="commands-scroll">
                <ul class="commands-list" id="commands-list" role="list"></ul>
                <p class="empty-state" id="empty-state" hidden>
                    Nothing matches that filter. Try a shorter query.
                </p>
            </div>

            <p class="scroll-hint" aria-hidden="true">
                <span>Scroll for more</span>
                <svg viewBox="0 0 12 12" width="12" height="12">
                    <path d="M3 5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </p>
        </section>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="../site.js"></script>
    <script src="../app.js" defer></script>
</body>
</html>
